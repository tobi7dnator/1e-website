<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3d print pagina</title>
    <style>
        body {
    font-family: "Bahnschrift";
    background-color: #F2F2F2;
}
    nav {
        position: absolute;
        top: 20px;
        right: 20px;
    }

    nav a {
        text-decoration: none;
        font-size: 16px;
    }
</style>
     <style>
.falling-image {
    position: fixed;
    top: -100px;
    width: 50px;
    animation: fall 6s linear;
    pointer-events: none;
    z-index: -1;
}

@keyframes fall {
    from {
        top: -100px;
    }

    to {
        top: 100vh;
    }
}
</style>
</head>

<body>
  <h1>-welkom bij mijn 3d-print pagina-</h1>
    <p style="margin-left: 20px;">-hier vind je ge3d-printe shiet-</p>
    <img src="p1sprinter.png" width="200" style="margin-left: 20px;">
    <br>
    <p style="margin-left: 20px;">Mijn printer: Bambulab P1S met AMS 2 pro</p>
    <nav><a href="index.html">klik hier om terug te gaan</a></nav>
    <script>
function createImage() {
    const image = document.createElement("img");

    const images = ["bluefilament.png", "green filament.png", "red filament.png"];
    image.src = images[Math.floor(Math.random() * images.length)];
    image.className = "falling-image";
    image.style.left = Math.random() * 100 + "vw";

    document.body.appendChild(image);

    setTimeout(() => {
        image.remove();
    }, 6000);
}

for (let i = 0; i < 5; i++) {
    setTimeout(createImage, i * 500);
}

setInterval(createImage, 500);
</script>
        
</body>
</html>
