<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Tobinators domein</title>
    <style>
        body {
    font-family: "Bahnschrift";
    background-color: #F2F2F2;
    }
    nav {
        position: absolute;
        top: 20px;
        right: 20px;
    }

    nav a {
        text-decoration: none;border:
        padding: 4px 4px;
        2px solid;
        font-size: 16px;
    }
</style>
    <style>
.falling-image {
    position: fixed;
    top: -100px;
    width: 50px;
    animation: fall 6s linear;
    pointer-events: none;
    z-index: -1;
}

@keyframes fall {
    from {
        top: -100px;
    }

    to {
        top: 100vh;
    }
}
</style>
</head>

<body>
  <h1>hallo welkom bij Tobinators domein</h1>
    <p>kom maar binnen</p>
    <img src="house.png" width="200">
       <nav>
           <a href="projects.html">klik hier voor 3d-print shiet</a>
           <br>
           <a href="games.html">klik hier voor mijn steam games</a>
       </nav> 
<script>
function createImage() {
    const image = document.createElement("img");

    image.src = "pizza.png";
    image.className = "falling-image";
    image.style.left = Math.random() * 100 + "vw";

    document.body.appendChild(image);

    setTimeout(() => {
        image.remove();
    }, 6000);
}

for (let i = 0; i < 5; i++) {
    setTimeout(createImage, i * 500);
}

setInterval(createImage, 500);
</script>

</body>
</html>
