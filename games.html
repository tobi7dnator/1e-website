<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tobinators games-pagina</title>
    <style>
        body {
    font-family: "Bahnschrift";
    background-color: #F2F2F2;
}
    nav {
        position: fixed;
        top: 20px;
        right: 20px;
    }

    nav a {
        text-decoration: none;
        font-size: 16px;
    }
.content {
    width: 600px;
    margin: 0 auto;
    text-align: center;
}

.content img {
    max-width: 100%;
}
</style>
     <style>
.falling-image {
    position: fixed;
    top: -100px;
    width: 50px;
    animation: fall 6s linear;
    pointer-events: none;
    z-index: -1;
}

@keyframes fall {
    from {
        top: -100px;
    }

    to {
        top: 100vh;
    }
}
</style>
</head>

<body>
  
   <h1 style="position: fixed;">-welkom bij mijn games pagina-</h1>
    <p style="margin-left: 20px; margin-top: 70px; position: fixed;">-hier vind je welke games ik zoal speel op steam-</p>
    <nav><a href="index.html">klik hier om terug te gaan</a></nav>

  
  <div class="content">
    <img src="dsp.png" width="500">
    <p>Dyson Sphere Program</p>
    <img src="astroneer.png" width="500">
    <p>Astroneer</p>
    <img src="satisfactory.png" width="500">
    <p>Satisfactory</p>
    <img src="civ6.png" width="500">
    <p>Sid Meier's Civ 6</p>
</div>

  
 
    <script>
function createImage() {
    const image = document.createElement("img");

    const images = ["dsp logo.png", "satisfactory cup.png", "compound.png", "civ6 oil.png"];
    image.src = images[Math.floor(Math.random() * images.length)];
    image.className = "falling-image";
    image.style.left = Math.random() * 100 + "vw";

    document.body.appendChild(image);

    setTimeout(() => {
        image.remove();
    }, 6000);
}

for (let i = 0; i < 5; i++) {
    setTimeout(createImage, i * 500);
}

setInterval(createImage, 500);
</script>
        
</body>
</html>
